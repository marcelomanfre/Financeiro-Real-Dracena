name: Publicar App no GitHub Pages

on:
  push:
    branches: ["main", "master"]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  construir_e_publicar:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Obter o código
        uses: actions/checkout@v4
      
      - name: Preparar o ambiente
        uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: Instalar ferramentas
        run: npm install --legacy-peer-deps
        
      - name: Compilar o projeto (Build)
        run: npm run build
        
      - name: Preparar ficheiros finais
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'
          
      - name: Colocar online
        id: deployment
        uses: actions/deploy-pages@v4
